<div class="chat-page-inner">
  <div class="chat-sidebar" #sidebarRoot>
    <app-chat-sidebar
      [chats]="facade.filteredChats()"
      [loading]="facade.isLoading()"
      (searchChange)="facade.setSearchId($event)"
      (selectChat)="facade.selectChat($event)"
    >
    </app-chat-sidebar>

    <div #pagingAnchor class="infinite-scroll-anchor"></div>
  </div>

  <div class="chat-view">
    <ng-container *ngIf="facade.selectedChat(); else placeholder">
      <div class="chat-box">
        <div class="chat-header">
          {{ facade.selectedChat()!.fullName }} (&#64;{{ facade.selectedChat()!.nickname }})
          <button class="client-info-button" (click)="facade.toggleClientInfo()" [title]="'chat.client-info' | translate">🧠</button>
        </div>

        <app-client-info-panel *ngIf="facade.clientInfoVisible()" [clientData]="facade.clientInfoData()" class="client-info-panel">
        </app-client-info-panel>

        <app-messages-list [messages]="facade.selectedChat()!.messages" (openImage)="facade.openImageModal($event)"> </app-messages-list>

        <app-image-modal [imageUrl]="facade.selectedImageUrl()" (closeModal)="facade.closeImageModal()"> </app-image-modal>

        <app-message-input (sendText)="facade.sendMessage($event.text, $event.file)"> </app-message-input>
      </div>
    </ng-container>

    <ng-template #placeholder>
      <div class="empty-chat-wrapper">
        <p class="placeholder-text">{{ 'chat.select-chat' | translate }}</p>
      </div>
    </ng-template>
  </div>
</div>
