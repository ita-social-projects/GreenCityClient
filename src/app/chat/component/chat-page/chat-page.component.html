<div class="chat-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="search-bar">
      <input type="text" placeholder="Search chats..." />
    </div>
    <ul class="chat-list">
      <li class="chat-item" *ngFor="let chat of chats" [class.selected]="chat.name === selectedChat?.name" (click)="selectChat(chat)">
        <div class="avatar">{{ chat.initial }}</div>
        <div class="chat-details">
          <div class="chat-name">{{ chat.name }}</div>
          <div class="last-message">{{ chat.lastMessage }}</div>
        </div>
        <div class="timestamp">{{ chat.time }}</div>
      </li>
    </ul>
  </aside>
  <section class="chat-view">
    <div *ngIf="selectedChat; else placeholder" class="chat-box">
      <div class="chat-header">{{ selectedChat.name }}</div>

      <div class="messages">
        <div
          *ngFor="let message of selectedChat.messages"
          [ngClass]="{
            message: true,
            sent: message.from === 'Me',
            received: message.from !== 'Me'
          }"
        >
          <div class="message-text">{{ message.text }}</div>
          <div class="message-time">{{ message.time }}</div>
        </div>
      </div>

      <div class="message-input-container">
        <input type="text" placeholder="Write a message..." [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" />
        <button (click)="sendMessage()">➤</button>
      </div>
    </div>
    <div
      *ngIf="selectedChat"
      style="display: flex; flex-direction: column; padding: 16px; background: #f7f7f7; border-top: 1px solid #ccc; gap: 10px"
    >
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px">
        <label
          style="
            display: inline-block;
            padding: 8px 14px;
            font-size: 14px;
            background-color: #4caf50;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            text-align: center;
          "
        >
          Choose File
          <input type="file" (change)="onFileSelected($event)" accept="image/*" style="display: none" />
        </label>

        <input
          type="text"
          placeholder="Caption"
          [(ngModel)]="caption"
          style="flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px"
        />
        <button
          (click)="uploadPhoto()"
          [disabled]="!selectedFile"
          style="
            padding: 8px 14px;
            font-size: 14px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
          [ngStyle]="{ backgroundColor: !selectedFile ? '#bbb' : '#4caf50', cursor: !selectedFile ? 'not-allowed' : 'pointer' }"
        >
          Upload Photo
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 10px">
        <input
          type="text"
          placeholder="Photo URL"
          [(ngModel)]="photoUrl"
          style="flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px"
        />
        <input
          type="text"
          placeholder="Caption"
          [(ngModel)]="caption"
          style="flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px"
        />
        <button
          (click)="sendUploadedPhoto(photoUrl)"
          [disabled]="!photoUrl"
          style="
            padding: 8px 14px;
            font-size: 14px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
          [ngStyle]="{ backgroundColor: !photoUrl ? '#bbb' : '#4caf50', cursor: !photoUrl ? 'not-allowed' : 'pointer' }"
        >
          Send Photo by URL
        </button>
      </div>
    </div>

    <ng-template #placeholder>
      <p class="placeholder-text">Select a chat to start messaging</p>
    </ng-template>
  </section>
</div>
