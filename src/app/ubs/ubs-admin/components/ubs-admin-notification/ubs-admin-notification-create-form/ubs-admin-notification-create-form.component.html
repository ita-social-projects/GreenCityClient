<form [formGroup]="form" (ngSubmit)="onSubmit()" class="notification-form">
  <div class="form-group">
    <label for="titleUk">{{ 'ubs-notifications.form.titleUk' | translate }}</label>
    <input id="titleUk" formControlName="titleUk" type="text" class="form-control" />
  </div>
  <app-input-error *ngIf="form.get('titleUk').invalid && form.get('titleUk').touched" [formElement]="form.get('titleUk')"></app-input-error>
  <div class="form-group">
    <label for="titleEn">{{ 'ubs-notifications.form.titleEn' | translate }}</label>
    <input id="titleEn" formControlName="titleEn" type="text" class="form-control" />
  </div>
  <app-input-error *ngIf="form.get('titleEn').invalid && form.get('titleEn').touched" [formElement]="form.get('titleEn')"></app-input-error>
  <div class="form-group">
    <label for="schedule">{{ 'ubs-notifications.form.schedule' | translate }}</label>
    <input id="schedule" formControlName="schedule" type="text" class="form-control" />
  </div>
  <app-input-error
    *ngIf="form.get('schedule').invalid && form.get('schedule').touched"
    [formElement]="form.get('schedule')"
  ></app-input-error>

  <div class="form-group">
    <label for="userCategory">{{ 'ubs-notifications.form.userCategory' | translate }}</label>
    <select id="userCategory" formControlName="userCategory" class="form-control">
      <option *ngFor="let category of userCategories" [value]="category">{{ category }}</option>
    </select>
  </div>
  <app-input-error
    *ngIf="form.get('userCategory').invalid && form.get('userCategory').touched"
    [formElement]="form.get('userCategory')"
  ></app-input-error>
  <div *ngFor="let platform of receiverTypes" class="platform-group">
    <fieldset class="platform-fieldset">
      <legend class="platform-legend">{{ platform }}</legend>

      <div class="form-group">
        <label [for]="'bodyUk_' + platform">{{ 'ubs-notifications.form.bodyUk' | translate }}</label>
        <textarea [id]="'bodyUk_' + platform" [formControlName]="'bodyUk_' + platform" class="form-control textarea"></textarea>
      </div>
      <app-input-error
        *ngIf="form.get('bodyUk_EMAIL')?.invalid && form.get('bodyUk_EMAIL')?.touched"
        [formElement]="form.get('bodyUk_EMAIL')"
      >
      </app-input-error>
      <div class="form-group">
        <label [for]="'bodyEn_' + platform">{{ 'ubs-notifications.form.bodyEn' | translate }}</label>
        <textarea [id]="'bodyEn_' + platform" [formControlName]="'bodyEn_' + platform" class="form-control textarea"></textarea>
      </div>
      <app-input-error
        *ngIf="form.get('bodyEn_EMAIL')?.invalid && form.get('bodyEn_EMAIL')?.touched"
        [formElement]="form.get('bodyEn_EMAIL')"
      >
      </app-input-error>
    </fieldset>
  </div>
  <div class="button-group">
    <button type="submit" [disabled]="form.invalid" class="submit-button">{{ 'ubs-notifications.form.submit' | translate }}</button>
    <button type="button" (click)="onCancel()" class="cancel-button">{{ 'ubs-notifications.form.cancel' | translate }}</button>
  </div>
</form>
