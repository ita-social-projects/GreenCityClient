<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label>Title (UA):</label>
    <input type="text" class="form-control" formControlName="titleUk" />
  </div>

  <div class="form-group">
    <label>Title (EN):</label>
    <input type="text" class="form-control" formControlName="titleEn" />
  </div>

  <div class="form-group">
    <label>Schedule (CRON):</label>
    <input type="text" class="form-control" formControlName="schedule" />
  </div>

  <div class="form-group">
    <label>User Category:</label>
    <select class="form-control" formControlName="userCategory">
      <option *ngFor="let category of userCategories" [value]="category">{{ category }}</option>
    </select>
  </div>

  <div class="form-group">
    <label>Body (UA):</label>
    <textarea class="form-control" formControlName="bodyUk"></textarea>
  </div>

  <div class="form-group">
    <label>Body (EN):</label>
    <textarea class="form-control" formControlName="bodyEn"></textarea>
  </div>

  <div class="form-group">
    <label>Receiver Type:</label>
    <select class="form-control" formControlName="notificationReceiverType">
      <option *ngFor="let type of receiverTypes" [value]="type">{{ type }}</option>
    </select>
  </div>

  <button class="btn btn-success" type="submit" [disabled]="form.invalid">Create Notification</button>
</form>
