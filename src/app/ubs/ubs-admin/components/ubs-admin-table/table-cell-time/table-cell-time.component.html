<div class="time_to_show">
  <span>{{ from }} - {{ to }}</span>
  <button *ngIf="!isEditable && !uneditableStatus" class="pencil" (click)="edit()" (keydown)="edit($event)"></button>
</div>
<app-time-picker
  *ngIf="isEditable && !uneditableStatus"
  (timeOfExport)="setExportTime($event)"
  [setTimeFrom]="fromInput"
  [exportDate]="exportDate"
  [setTimeTo]="toInput"
>
</app-time-picker>
