<div
  class="comments"
  #tooltip="matTooltip"
  matTooltip="{{ data | serverTranslate: lang }}"
  (mouseenter)="onMouseEnter($event, tooltip)"
  (mouseleave)="tooltip.hide()"
>
  <span>{{ data | serverTranslate: lang }}</span>
  <button *ngIf="!isEditable && !isUneditableStatus" (keydown.enter)="edit()" (click)="edit()" class="pencil"></button>
  <button
    *ngIf="isAddressKey() && !isEditable && !isUneditableStatus"
    (keydown.enter)="openEditAddressWindow()"
    (click)="openEditAddressWindow()"
    class="pencil"
  ></button>
</div>
